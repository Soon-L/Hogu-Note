<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새 메모</title>
  <!--quill editor 연결-->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <!--CodeMirror editor 연결-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/theme/dracula.min.css">
  <!--일반 css-->
  <link rel="stylesheet" th:href="@{/newMemo.css}" />
</head>
<body th:data-check-exist="${checkExist}">
 
  <!-- 메뉴바 -->
  <nav class="menubar">
    <span class="menubar-title">
      <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h14a2 2 0 012 2v11a2 2 0 01-2 2H7l-4 4V5z"/></svg>
      누렁메모
    </span>
	<button id="widemode" class="menu-btn" th:if="${role == 'WRITER'}" onclick="widemode()">
	  와이드모드
	</button>
	<button id="darkmode" class="menu-btn" th:if="${role == 'WRITER'}" onclick="darkmode()">
	  다크모드
	</button>
	<button id="codebox" class="menu-btn" th:if="${role == 'WRITER'}" onclick="codebox()">
	  코드박스
	</button>
    <button class="menu-btn" th:if="${role == 'WRITER'}" onclick="openSave()">
      <svg viewBox="0 0 24 24"><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      저장
    </button>
    <button class="menu-btn" th:if="${role == 'WRITER'}" onclick="openModal('load')">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      불러오기
    </button>
    <button class="menu-btn" th:if="${role == 'WRITER'}" onclick="openModal('share')">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      공유하기
    </button>
    <button class="menu-btn" onclick="doExit()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      나가기
    </button>
  </nav>
 
  <!-- 에디터 -->
<!--  <div class="editor-wrap">
    <textarea placeholder="여기에 메모를 작성하세요…"
              id="originalMemo"
              name="originalMemo"
              oninput="sendMemo()"
              th:readonly="${role == 'VIEWER'}"
              th:classappend="${role == 'VIEWER'} ? ' viewer-mode'"></textarea>
  </div>-->
  <!--권한 부여-->
  <div id="role" style="display: none;" th:text="${role}"></div>
  
  <!--CodeMirror editor-->
  <div id="CodeMirror-editor" class="editor-wrap codeBox"></div>
  
  <!--quill editor-->
  <div id="quill-editor" class="editor-wrap" oninput="sendMemo()"></div> <!--textarea처럼 활용-->
  <!--<div id="quill-editor" class="editor-wrap"></div>--><!--quill dalta 활용-->
  
  
 
  <!-- 저장 모달 -->
  <div class="overlay" id="modal-save" onclick="closeOnOverlay(event, 'save')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('save')">✕</button>
      <div class="modal-icon icon-save">
        <svg viewBox="0 0 24 24"><path d="M12 1l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
      </div>
      <div class="modal-title">저장</div>
	  <div>
	  	<input id="secretmodeBtn" type="checkbox" onclick="secretmode()">시크릿모드로 저장하기
	  </div>
      <div class="secretmode modal-desc">시크릿 모드로 저장하려면<br/>비밀번호를 입력해주세요</div>
	  <div>
		<div class="modal-row">
		  <input class="secretmode" type="password" placeholder="비밀번호 입력" id="savePassword" name="password">
		  <button class="btn-modal btn-primary" onclick="doSaveClick()">저장</button>
		</div>
	  </div>
    </div>
  </div>
 
  
  
  
  
  <!-- 불러오기 모달 -->
  <div class="overlay" id="modal-load" onclick="closeOnOverlay(event, 'load')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('load')">✕</button>
      <div class="modal-icon icon-load">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div class="modal-title">불러오기</div>
      <div class="modal-desc">발급받은 코드를 입력해주세요</div>
      <div class="modal-row">
        <input type="text" placeholder="코드 입력" id="loadCode" />
        <button class="btn-modal btn-primary" onclick="doLoad()">불러오기</button>
      </div>
    </div>
  </div>
  
  
  <!--불러오기 비밀번호 모달-->
  <div class="overlay" id="modal-password" onclick="closeOnOverlay(event, 'exit')">
  	<div class="modal">
  	<button class="modal-close" onclick="closeModal('password')">X</button>
  	<div>
  		<div>비밀번호를 입력해주세요</div>
  		<input id="loadPassword" type="password">
  		<button type="submit" onclick="checkPassword()">불러오기</button>
  	</div>
  </div>
  </div>
  
  
  <!-- 불러오기 전 저장할건지 묻는 모달 -->
  <div class="overlay" id="modal-saveAndLoad" onclick="closeOnOverlay(event, 'saveAndLoad')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('saveAndLoad')">✕</button>
      <div class="modal-icon icon-exit">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div class="modal-title">불러오기</div>
      <div class="modal-desc">변경 사항이 있습니다. 저장하시겠습니까?</div>
      <div class="btn-exit-pair">
        <button class="btn-modal btn-warning" onclick="doNotSaveLoad()">불러오기</button>
        <button class="btn-modal btn-primary" onclick="saveAndLoad()">저장 후 불러오기</button>
      </div>
    </div>
  </div>
  
  
  
  
  
 
  <!-- 공유하기 모달 -->
  <div class="overlay" id="modal-share" onclick="closeOnOverlay(event, 'share')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('share')">✕</button>
      <div class="modal-icon icon-share">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </div>
      <div class="modal-title">공유하기</div>
      <div class="modal-desc">아래 코드를 공유해주세요</div>

      <!-- ▼ 복사 완료 안내창 ▼ -->
      <div id="copy-notification" class="copy-notification">코드가 클립보드에 복사되었습니다!</div>

      <div class="share-code-row">
        <div class="code-box" id="personalCode" th:text="${personalCode}">test code</div>
        <button class="btn-copy" onclick="doCopy()">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          복사
        </button>
      </div>
      <div class="share-divider"><span>또는</span></div>
	  <a href="javascript:shareMessage()">
		<button class="btn-kakao" type="button">
		  <span class="kakao-emoji">💬</span>
		  카카오톡으로 공유하기
		</button>
	  </a>
    </div>
  </div>
 
  
  
  
  
  
  <!-- 나가기 전 저장할건지 묻는 모달 -->
  <div class="overlay" id="modal-saveAndExit" onclick="closeOnOverlay(event, 'saveAndExit')">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('saveAndExit')">✕</button>
      <div class="modal-icon icon-exit">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div class="modal-title">나가기</div>
      <div class="modal-desc">변경 사항이 있습니다. 저장하시겠습니까?</div>
      <div class="btn-exit-pair">
        <button class="btn-modal btn-warning" onclick="doExitNow()">나가기</button>
        <button class="btn-modal btn-primary" onclick="doSaveAndExit()">저장 후 나가기</button>
      </div>
    </div>
  </div>
 
  <!-- SockJS + STOMP 클라이언트 -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <!--quill editor 연결-->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <!--CodeMirror editor 연결-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/mode/javascript/javascript.min.js"></script>
  <!--카카오 공유하기-->
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  <!--일반 js-->
  <script th:src="@{/newMemo.js}"></script>
</body>
</html>
