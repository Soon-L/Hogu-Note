<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>누렁메모</title>
  <link th:href="@{https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap}" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <!-- 메모 아이콘 -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 5a2 2 0 012-2h14a2 2 0 012 2v11a2 2 0 01-2 2H7l-4 4V5z"/>
      </svg>
    </div>

    <h1>누렁메모</h1>
    <p class="subtitle"> 메모를 간편하게 보관하세요</p>

    <div class="section-label">코드로 불러오기</div>
    <div class="input-row">
		<input type="text" placeholder="발급받은 코드를 입력하세요" id="codeInput">
		<button class="btn-load" id="loadMemo" onclick="doLoad()">불러오기</button>
    </div>

    <div class="divider"><span>또는</span></div>

    <a th:href="@{/new_memo}" class="btn-new">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      새로 만들기
    </a>
  </div>
  
  
  
  
  <!--불러오기 비밀번호 모달-->
  <div class="overlay" id="modal-password" onclick="closeOnOverlay(event, 'exit')">
  	<div class="modal">
		<button class="modal-close" onclick="closeModal('password')">X</button>
		<div>
			<div>비밀번호를 입력해주세요</div>
			<input id="passwordInput" type="password">
			<button type="submit" onclick="checkPassword()">불러오기</button>
		</div>
	</div>
  </div>
  
  
  <script th:src="@{/main.js}"></script>
</body>
</html>
